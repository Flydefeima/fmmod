plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.38'
}

ext {
    minecraft_version = '1.20.1'
    forge_version     = '47.3.0'
}

group            = 'com.feima.movemod'
version          = '1.0.1'

base {
    archivesName = 'feimamovemod-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.mojang_level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { feimamovemod { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.mojang_level', 'info'
            mods { feimamovemod { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.mojang_level', 'info'
            args '--mod', 'feimamovemod', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods { feimamovemod { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'feimamovemod.refmap.json'
    config 'feimamovemod.mixins.json'
    config 'feimamovemod.tacz.mixins.json'
}

repositories {
    mavenCentral()
    // 用 rootProject.file 锚定路径，避免从其它工作目录调用时解析错。
    maven { url = rootProject.file('libs').toURI() }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf('tacz:tacz:1.1.8-hotfix')
    runtimeOnly fg.deobf('tacz:tacz:1.1.8-hotfix')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "feimamovemod",
                "Specification-Vendor"    : "Feima",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "Feima",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "License"                 : "MIT"
        ])
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}